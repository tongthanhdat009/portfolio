services:
  mongo:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: portfolio123
      MONGO_INITDB_DATABASE: portfolio_cms
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "admin", "-p", "portfolio123", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Laravel CMS API (spec 11.1). Host PHP lacks ext-mongodb, so the API runs here.
  backend:
    build: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: "mongodb://admin:portfolio123@mongo:27017/portfolio_cms?authSource=admin"
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000,localhost:3001,localhost:9000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["sh", "-c", "cd public && exec php -S 0.0.0.0:9000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]

  # S3-compatible storage for local media dev (spec 5.1; Moto S3 mock).
  # MinIO left Docker Hub and LocalStack now requires an auth token, Moto runs free.
  s3:
    image: motoserver/moto:latest
    container_name: portfolio-s3
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MOTO_S3_DEFAULT_KEY_BUFFER_SIZE: "65536"
    command: ["-H", "0.0.0.0", "-p", "5000"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/', timeout=5)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mongo_data:
    name: portfolio_mongo_data
  s3_data:
    name: portfolio_s3_data
